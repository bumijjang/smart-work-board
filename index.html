<!DOCTYPE html>
<html lang="ko">
<head>
<link rel="manifest" href="manifest.json">

<meta name="theme-color" content="#0b1120">

<link rel="apple-touch-icon" href="icon-192.png">

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>스마트 업무 통합 관리 보드</title>
<style>
  :root {
    --bg-color: #0b1120;
    --card-bg: #1e293b;
    --border-color: #334155;
    --text-main: #f8fafc;
    --text-sub: #94a3b8;
    --todo-color: #38bdf8;
    --doing1-color: #f59e0b;
    --doing2-color: #fb923c;
    --done-color: #10b981;
    --alert-red: #ef4444;

    /* 테마가 적용되기 전에도 Dark 기본값으로 안정적으로 표시 */
    --surface-1: #0f172a;
    --surface-2: #1e293b;
    --surface-3: #334155;
    --button-bg: #2563eb;
    --button-active-bg: #1d4ed8;
    --button-text: #ffffff;
    --input-bg: #0f172a;
    --shadow-color: rgba(0, 0, 0, 0.35);

    /* 카드 내부 공통 테마 토큰 */
    --panel-bg: rgba(15, 23, 42, 0.6);
    --panel-border: rgba(255,255,255,0.05);
    --divider-color: rgba(255,255,255,0.06);
    --pill-bg: #334155;
    --pill-border: #475569;
    --done-card-bg: rgba(30, 41, 59, 0.6);
    --link-color: #38bdf8;
  }
/* ========================================================
   UI THEME SYSTEM
   - 기본값은 현재 Dark Theme
======================================================== */


/* DARK MODE */
body.theme-dark {

    color-scheme: dark;

    --bg-color: #0b1120;
    --card-bg: #1e293b;
    --border-color: #334155;

    --text-main: #f8fafc;
    --text-sub: #94a3b8;

    --surface-1: #0f172a;
    --surface-2: #1e293b;
    --surface-3: #334155;

    --button-bg: #2563eb;
    --button-active-bg: #1d4ed8;
    --button-text: #ffffff;

    --input-bg: #0f172a;

    --shadow-color: rgba(0, 0, 0, 0.35);

    --panel-bg: rgba(15, 23, 42, 0.6);
    --panel-border: rgba(255,255,255,0.05);
    --divider-color: rgba(255,255,255,0.06);
    --pill-bg: #334155;
    --pill-border: #475569;
    --done-card-bg: rgba(30, 41, 59, 0.6);
    --link-color: #38bdf8;

}


/* LIGHT MODE */
body.theme-light {

    color-scheme: light;

    --bg-color: #f1f5f9;
    --card-bg: #ffffff;
    --border-color: #cbd5e1;

    --text-main: #0f172a;
    --text-sub: #64748b;

    --surface-1: #ffffff;
    --surface-2: #f8fafc;
    --surface-3: #e2e8f0;

    --button-bg: #2563eb;
    --button-active-bg: #1d4ed8;
    --button-text: #ffffff;

    --input-bg: #ffffff;

    --shadow-color: rgba(15, 23, 42, 0.12);

    --panel-bg: #f1f5f9;
    --panel-border: #cbd5e1;
    --divider-color: #e2e8f0;
    --pill-bg: #f1f5f9;
    --pill-border: #cbd5e1;
    --done-card-bg: #f8fafc;
    --link-color: #0284c7;

}


/* CINEMA MODE */
body.theme-cinema {

    color-scheme: dark;

    --bg-color: #100d0b;
    --card-bg: #211a16;
    --border-color: #554436;

    --text-main: #fff8e7;
    --text-sub: #c5b59f;

    --surface-1: #18120f;
    --surface-2: #261d18;
    --surface-3: #45362b;

    --button-bg: #a97932;
    --button-active-bg: #7c5728;
    --button-text: #fff8e7;

    --input-bg: #18120f;

    --shadow-color: rgba(0, 0, 0, 0.55);

    --panel-bg: #171411;
    --panel-border: #3b3028;
    --divider-color: #3d3027;
    --pill-bg: #35291f;
    --pill-border: #5b4636;
    --done-card-bg: #1b1612;
    --link-color: #d8a64d;

}
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Pretendard", "Segoe UI", sans-serif; -webkit-tap-highlight-color: transparent; }
  body { background-color: var(--bg-color); color: var(--text-main); min-height: 100vh; padding: 16px; }

  /* Top Bar & Editable Title */
  .top-bar {
    max-width: 1600px;
    margin: 0 auto 16px auto;
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 12px;
    border-bottom: 1px solid var(--border-color);
    padding-bottom: 14px;
  }
  .app-title-wrap { display: flex; align-items: center; gap: 8px; flex: 1; min-width: 260px; }
  .app-title {
    font-size: 1.35rem;
    font-weight: 800;
    color: var(--text-main);
    outline: none;
    padding: 4px 8px;
    border-radius: 6px;
    border: 1px solid transparent;
    cursor: text;
    line-height: 1.3;
  }
  .app-title:focus { background: var(--input-bg); border-color: var(--todo-color); }

  .btn-group { display: flex; gap: 8px; flex-wrap: wrap; }
  /* =========================================
   클라우드 동기화 상태 표시
========================================= */

.cloud-sync-status {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 7px;

    padding: 10px 14px;

    border-radius: 8px;

    font-size: 0.85rem;
    font-weight: 800;

    white-space: nowrap;
    user-select: none;

    transition: all 0.2s ease;
}


/* 클라우드 연결 전 */
.cloud-sync-status.waiting {
    background: rgba(148, 163, 184, 0.12);
    border: 1px solid rgba(148, 163, 184, 0.45);
    color: #cbd5e1;
}


/* 저장 중 */
.cloud-sync-status.syncing {
    background: rgba(245, 158, 11, 0.12);
    border: 1px solid rgba(245, 158, 11, 0.5);
    color: #fbbf24;
}


/* 동기화 완료 */
.cloud-sync-status.synced {
    background: rgba(16, 185, 129, 0.12);
    border: 1px solid rgba(16, 185, 129, 0.5);
    color: #6ee7b7;
}


/* 동기화 실패 */
.cloud-sync-status.error {
    background: rgba(239, 68, 68, 0.12);
    border: 1px solid rgba(239, 68, 68, 0.5);
    color: #fca5a5;
}

/* 라이트 모드에서는 상태 글씨 대비를 높임 */
body.theme-light .cloud-sync-status.waiting { color: #475569; }
body.theme-light .cloud-sync-status.syncing { color: #b45309; }
body.theme-light .cloud-sync-status.synced { color: #047857; }
body.theme-light .cloud-sync-status.error { color: #b91c1c; }


/* 왼쪽 작은 상태 점 */
.cloud-sync-dot {
    width: 8px;
    height: 8px;

    border-radius: 50%;

    background: currentColor;

    box-shadow: 0 0 7px currentColor;

    flex-shrink: 0;
}
  .btn-sync {
    background: var(--pill-bg);
    color: var(--text-sub);
    border: 1px solid var(--pill-border);
    padding: 10px 14px;
    border-radius: 8px;
    font-weight: 700;
    font-size: 0.85rem;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 6px;
    user-select: none;
  }
  .btn-sync:active { background: var(--surface-3); color: var(--text-main); }
/* 테마 선택 드롭다운 */
.theme-select {
    background: var(--surface-2, #1e293b);
    color: var(--text-main);
    border: 1px solid var(--border-color);
    padding: 9px 12px;
    border-radius: 8px;
    font-size: 0.85rem;
    font-weight: 700;
    cursor: pointer;
    outline: none;
}

.theme-select:focus {
    border-color: var(--todo-color);
}
  .btn-new-task {
    background: var(--button-bg);
    color: var(--button-text);
    border: none;
    padding: 10px 18px;
    border-radius: 8px;
    font-weight: 700;
    font-size: 0.88rem;
    cursor: pointer;
    white-space: nowrap;
    user-select: none;
  }
  .btn-new-task:active { background: var(--button-active-bg); transform: scale(0.98); }

  /* iPad Portrait Tab Switcher */
  .tab-nav {
    display: none;
    grid-template-columns: repeat(4, 1fr);
    gap: 6px;
    max-width: 1600px;
    margin: 0 auto 16px auto;
  }
  .tab-btn {
    background: var(--surface-2);
    border: 1px solid var(--border-color);
    color: var(--text-sub);
    padding: 10px 4px;
    border-radius: 8px;
    font-weight: 700;
    font-size: 0.82rem;
    cursor: pointer;
    text-align: center;
    white-space: nowrap;
  }
  .tab-btn.active {
    background: var(--surface-3);
    color: var(--text-main);
    border-color: var(--todo-color);
  }

  /* Kanban Board Grid */
  .kanban-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 14px;
    max-width: 1600px;
    margin: 0 auto;
  }

  @media (max-width: 1100px), (orientation: portrait) and (max-width: 1024px) {
    .tab-nav { display: grid; }
    .kanban-grid { grid-template-columns: 1fr; }
    .kanban-col { display: none !important; }
    .kanban-col.active-col { display: flex !important; }
  }

  @media (orientation: landscape) and (min-width: 1101px) {
    .tab-nav { display: none !important; }
    .kanban-grid { grid-template-columns: repeat(4, 1fr) !important; }
    .kanban-col { display: flex !important; }
  }

  /* Column Styles */
  .kanban-col {
    background: var(--surface-1);
    border: 1px solid var(--border-color);
    border-radius: 12px;
    padding: 14px;
    display: flex;
    flex-direction: column;
    min-height: 75vh;
  }
  .col-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 14px;
    padding-bottom: 8px;
    border-bottom: 2px solid;
  }
  .col-header.todo { border-color: var(--todo-color); color: var(--todo-color); }
  .col-header.doing1 { border-color: var(--doing1-color); color: var(--doing1-color); }
  .col-header.doing2 { border-color: var(--doing2-color); color: var(--doing2-color); }
  .col-header.done { border-color: var(--done-color); color: var(--done-color); }
  .col-title { font-size: 0.98rem; font-weight: 800; display: flex; align-items: center; gap: 5px; }
  .col-count {
    background: var(--surface-3);
    color: var(--text-main);
    font-size: 0.75rem;
    padding: 2px 8px;
    border-radius: 12px;
    font-weight: 700;
  }

  .task-list {
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }

  /* Task Card */
  .task-card {
    background: var(--card-bg);
    border: 1px solid var(--border-color);
    border-radius: 10px;
    padding: 14px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    position: relative;
    box-shadow: 0 4px 12px var(--shadow-color);
  }
  .task-card.dragging { opacity: 0.4; }
  .task-card.dragover-card { border: 2px dashed var(--todo-color); background: rgba(56, 189, 248, 0.08); }

  .task-card.done-compact {
    opacity: 0.85;
    background: var(--done-card-bg);
    border-color: rgba(16, 185, 129, 0.3);
    padding: 12px;
    gap: 8px;
  }
  .task-card.done-compact .card-title {
    font-size: 0.98rem;
    color: var(--text-sub);
    text-decoration: line-through;
  }

  /* Card Elements */
  .card-top { display: flex; justify-content: space-between; align-items: center; gap: 6px; flex-wrap: wrap; }
  .d-day-badge {
    font-size: 0.72rem;
    font-weight: 800;
    padding: 3px 6px;
    border-radius: 4px;
    display: inline-flex;
    align-items: center;
    gap: 3px;
  }
  .d-day-urgent { background: rgba(239, 68, 68, 0.2); color: #fca5a5; border: 1px solid #ef4444; }
  .d-day-warn { background: rgba(245, 158, 11, 0.2); color: #fde68a; border: 1px solid #f59e0b; }
  .d-day-normal { background: rgba(56, 189, 248, 0.15); color: #bae6fd; border: 1px solid #38bdf8; }
  .done-badge { background: rgba(16,185,129,0.2); color:#6ee7b7; border:1px solid #10b981; }
  .done-date { font-size:0.75rem; color:var(--text-sub); }

  /* 라이트 모드 D-Day/완료 배지 대비 보정 */
  body.theme-light .d-day-urgent { background:#fff1f2; color:#b91c1c; }
  body.theme-light .d-day-warn { background:#fffbeb; color:#92400e; }
  body.theme-light .d-day-normal { background:#f0f9ff; color:#0369a1; }
  body.theme-light .done-badge { background:#ecfdf5; color:#047857; }

  .date-picker-group { display: flex; align-items: center; gap: 2px; font-size: 0.75rem; color: var(--text-sub); }
  .inline-date-input {
    background: transparent;
    border: 1px solid transparent;
    color: var(--text-sub);
    font-size: 0.75rem;
    padding: 3px 4px;
    border-radius: 4px;
    outline: none;
  }
  .inline-date-input:focus {
    background: var(--input-bg);
    border-color: var(--border-color);
    color: var(--text-main);
  }

  .card-title {
    font-size: 1.05rem;
    font-weight: 800;
    color: var(--text-main);
    line-height: 1.4;
    outline: none;
    padding: 4px 6px;
    border-radius: 4px;
    border: 1px solid transparent;
    word-break: keep-all;
    cursor: text;
  }
  .card-title:focus { background: var(--input-bg); border-color: var(--todo-color); }

  /* Checklist */
  .subtasks-container {
    background: var(--panel-bg);
    padding: 8px 10px;
    border-radius: 8px;
    display: flex;
    flex-direction: column;
    gap: 6px;
    border: 1px solid var(--panel-border);
  }
  .subtask-row {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 0.85rem;
    line-height: 1.4;
  }
  .subtask-row input[type="checkbox"] {
    width: 18px;
    height: 18px;
    accent-color: var(--todo-color);
    cursor: pointer;
    flex-shrink: 0;
  }
  .subtask-text {
    flex: 1;
    color: var(--text-main);
    outline: none;
    padding: 3px 4px;
    border-radius: 4px;
    border: 1px solid transparent;
    word-break: break-all;
    cursor: text;
  }
  .subtask-text:focus { background: var(--input-bg); border-color: var(--todo-color); color: var(--text-main); }
  .subtask-row.completed .subtask-text {
    text-decoration: line-through;
    color: var(--text-sub);
    opacity: 0.72;
  }
  .btn-subtask-del {
    background: transparent;
    border: none;
    color: var(--text-sub);
    cursor: pointer;
    font-size: 0.85rem;
    padding: 2px 6px;
  }

  .btn-add-subtask {
    background: transparent;
    border: 1px dashed var(--pill-border);
    color: var(--text-sub);
    padding: 6px 10px;
    border-radius: 4px;
    font-size: 0.78rem;
    cursor: pointer;
    text-align: left;
    margin-top: 2px;
  }

  /* Attachments */
  .attachments-section {
    border-top: 1px dashed var(--divider-color);
    padding-top: 8px;
    display: flex;
    flex-direction: column;
    gap: 5px;
  }
  .att-top { display: flex; justify-content: space-between; align-items: center; }
  .att-header { font-size: 0.72rem; font-weight: 700; color: var(--text-sub); }
  .btn-add-file {
    background: transparent;
    border: none;
    color: var(--link-color);
    font-size: 0.78rem;
    cursor: pointer;
    font-weight: 700;
    padding: 3px 6px;
  }

  .att-list { display: flex; flex-wrap: wrap; gap: 5px; }
  .att-pill {
    background: var(--pill-bg);
    color: var(--text-main);
    padding: 4px 8px;
    border-radius: 5px;
    font-size: 0.72rem;
    display: flex;
    align-items: center;
    gap: 5px;
    border: 1px solid var(--pill-border);
  }
  .att-name { max-width: 120px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; cursor: pointer; color: var(--link-color); }
  .att-del { background: transparent; border: none; color: var(--text-sub); cursor: pointer; font-size: 0.8rem; padding: 0 3px; }

  /* Card Footer */
  .card-footer {
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-top: 1px solid var(--divider-color);
    padding-top: 8px;
    margin-top: 2px;
  }
  .move-select {
    background: var(--input-bg);
    color: var(--text-main);
    border: 1px solid var(--border-color);
    font-size: 0.8rem;
    padding: 5px 8px;
    border-radius: 5px;
    cursor: pointer;
    outline: none;
  }
  .btn-del-card {
    background: transparent;
    border: 1px solid var(--pill-border);
    color: var(--text-sub);
    padding: 4px 10px;
    border-radius: 5px;
    font-size: 0.75rem;
    cursor: pointer;
  }

  /* Modal (iPad 터치 백업/복원 텍스트 지원) */
  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.75);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 2000;
    padding: 16px;
  }
  .modal-box {
    background: var(--card-bg);
    border: 1px solid var(--border-color);
    border-radius: 12px;
    max-width: 600px;
    width: 100%;
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 12px;
    box-shadow: 0 10px 30px var(--shadow-color);
  }
  .modal-box textarea {
    width: 100%;
    height: 180px;
    background: var(--input-bg);
    border: 1px solid var(--border-color);
    color: var(--text-main);
    padding: 10px;
    border-radius: 6px;
    font-size: 0.82rem;
    font-family: monospace;
    outline: none;
    resize: none;
  }
</style>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  
</head>
<body>

<!-- =====================================================
     Supabase 로그인 화면
===================================================== -->

<div id="cloudLoginBox"
     style="
       position: fixed;
       inset: 0;
       z-index: 99999;
       background: var(--bg-color);
       display: flex;
       justify-content: center;
       align-items: center;
       padding: 20px;
     ">

    <div style="
        width: 100%;
        max-width: 380px;
        background: var(--card-bg);
        border: 1px solid var(--border-color);
        border-radius: 14px;
        padding: 24px;
        color: var(--text-main);
        box-shadow: 0 12px 35px var(--shadow-color);
    ">

        <div style="
            font-size: 1.3rem;
            font-weight: 800;
            margin-bottom: 8px;
        ">
            🔐 업무 관리 보드 로그인
        </div>

        <div style="
            color: var(--text-sub);
            font-size: 0.85rem;
            line-height: 1.5;
            margin-bottom: 18px;
        ">
            처음 한 번만 로그인하면<br>
            다음부터는 자동으로 로그인됩니다.
        </div>


        <input
            id="cloudEmail"
            type="email"
            placeholder="이메일 주소"
            autocomplete="username"
            style="
                width: 100%;
                padding: 12px;
                margin-bottom: 10px;
                border-radius: 8px;
                border: 1px solid var(--border-color);
                background: var(--input-bg);
                color: var(--text-main);
                font-size: 16px;
                outline: none;
            "
        >


        <input
            id="cloudPassword"
            type="password"
            placeholder="비밀번호"
            autocomplete="current-password"
            style="
                width: 100%;
                padding: 12px;
                margin-bottom: 12px;
                border-radius: 8px;
                border: 1px solid var(--border-color);
                background: var(--input-bg);
                color: var(--text-main);
                font-size: 16px;
                outline: none;
            "
        >


        <button
            id="cloudLoginButton"
            type="button"
            onclick="cloudLogin()"
            style="
                width: 100%;
                padding: 12px;
                border: none;
                border-radius: 8px;
                background: var(--button-bg);
                color: var(--button-text);
                font-size: 16px;
                font-weight: 800;
                cursor: pointer;
            ">
            로그인
        </button>


        <div
            id="cloudLoginMessage"
            style="
                min-height: 20px;
                margin-top: 12px;
                color: var(--alert-red);
                font-size: 0.82rem;
                line-height: 1.4;
            ">
        </div>

    </div>

</div>
  
  <!-- Top Bar -->
  <header class="top-bar">
    <div class="app-title-wrap">
      <span>📂</span>
      <div class="app-title" id="mainAppTitle" contenteditable="true" 
           onblur="saveAppTitle(this.innerText)" 
           onkeydown="handleTitleKeydown(event, this)">스마트 행정·정보화 업무 통합 관리 보드</div>
    </div>
    <div class="btn-group">

/* ========================================================

const SUPABASE_PUBLISHABLE_KEY =

const sb = window.supabase.createClient(

/* ========================================================

let cloudReady = false;

/* ========================================================
   UI 테마 변경 / 저장
======================================================== */

const THEME_STORAGE_KEY =
    "SMART_BOARD_UI_THEME";


function applyTheme(theme) {

    const allowedThemes = [
        "dark",
        "light",
        "cinema"
    ];


    const safeTheme =
        allowedThemes.includes(theme)
            ? theme
            : "dark";


    /*
       기존 테마 클래스 제거
    */
    document.body.classList.remove(
        "theme-dark",
        "theme-light",
        "theme-cinema"
    );


    /*
       선택한 테마 적용
    */
    document.body.classList.add(
        "theme-" + safeTheme
    );


    /*
       드롭다운 표시도 현재 테마에 맞춤
    */
    const select =
        document.getElementById(
            "themeSelect"
        );

    if (select) {
        select.value = safeTheme;
    }


    /*
       현재 기기에 선택 테마 기억
    */
    try {

        localStorage.setItem(
            THEME_STORAGE_KEY,
            safeTheme
        );

    } catch (e) {

        console.log(
            "테마 저장 제한:",
            e
        );
    }


    /*
       Safari / 모바일 브라우저 상단 색상도 맞춤
    */
    const themeColorMeta =
        document.querySelector(
            'meta[name="theme-color"]'
        );


    if (themeColorMeta) {

        const themeColors = {
            dark: "#0b1120",
            light: "#f1f5f9",
            cinema: "#100d0b"
        };


        themeColorMeta.setAttribute(
            "content",
            themeColors[safeTheme]
        );
    }
}


/*
   저장된 테마 불러오기
*/
function initTheme() {

    let savedTheme = "dark";


    try {

        savedTheme =
            localStorage.getItem(
                THEME_STORAGE_KEY
            )
            ||
            "dark";

    } catch (e) {

        savedTheme = "dark";
    }


    applyTheme(
        savedTheme
    );


    const select =
        document.getElementById(
            "themeSelect"
        );


    if (select) {

        select.addEventListener(
            "change",
            function() {

                applyTheme(
                    this.value
                );
            }
        );
    }
}


/*
   페이지 시작 시 테마 적용
*/
initTheme();

/* 상단의 클라우드 상태 표시 변경 */
function setCloudSyncStatus(status, text) {

    const box =
        document.getElementById("cloudSyncStatus");

    const textEl =
        document.getElementById("cloudSyncText");

    if (!box || !textEl) return;

    box.classList.remove(
        "waiting",
        "syncing",
        "synced",
        "error"
    );

    box.classList.add(status);

    if (text) {
        textEl.innerText = text;
        return;
    }

    if (status === "waiting") {
        textEl.innerText = "☁ 클라우드 연결 중...";
    }

    else if (status === "syncing") {
        textEl.innerText = "☁ 저장 중...";
    }

    else if (status === "synced") {
        textEl.innerText = "☁ 동기화 완료";
    }

    else if (status === "error") {
        textEl.innerText = "☁ 동기화 실패";
    }
}


/* 로그인 버튼을 눌렀을 때 */
async function cloudLogin() {

    const emailInput =
        document.getElementById("cloudEmail");

    const passwordInput =
        document.getElementById("cloudPassword");

    const message =
        document.getElementById("cloudLoginMessage");

    const button =
        document.getElementById("cloudLoginButton");


    const email =
        emailInput.value.trim();

    const password =
        passwordInput.value;


    if (!email || !password) {

        message.innerText =
            "이메일과 비밀번호를 모두 입력하세요.";

        return;
    }


    button.disabled = true;
    button.innerText = "로그인 중...";

    message.innerText = "";

    setCloudSyncStatus(
        "waiting",
        "☁ 로그인 확인 중..."
    );


    const { error } =
        await sb.auth.signInWithPassword({
            email: email,
            password: password
        });


    if (error) {

        console.error(
            "로그인 오류:",
            error
        );

        message.innerText =
            "로그인에 실패했습니다. 이메일과 비밀번호를 확인하세요.";

        button.disabled = false;
        button.innerText = "로그인";

        setCloudSyncStatus(
            "error",
            "☁ 로그인 실패"
        );

        return;
    }


    passwordInput.value = "";

    document.getElementById(
        "cloudLoginBox"
    ).style.display = "none";


    await loadCloudBoard();


    button.disabled = false;
    button.innerText = "로그인";
}

/* ========================================================
   자동 로그인 확인
======================================================== */

async function initCloud() {

    setCloudSyncStatus(
        "waiting",
        "☁ 클라우드 연결 중..."
    );

    const {
        data: { session },
        error
    } = await sb.auth.getSession();


    if (error) {

        console.error(
            "세션 확인 오류:",
            error
        );

        document.getElementById(
            "cloudLoginBox"
        ).style.display = "flex";

        setCloudSyncStatus(
            "error",
            "☁ 연결 실패"
        );

        return;
    }


    /* 로그인 기록이 없는 경우 */
    if (!session) {

        document.getElementById(
            "cloudLoginBox"
        ).style.display = "flex";

        setCloudSyncStatus(
            "waiting",
            "☁ 로그인 필요"
        );

        return;
    }


    /* 이미 로그인되어 있는 경우 */
    document.getElementById(
        "cloudLoginBox"
    ).style.display = "none";

    await loadCloudBoard();
}


/* ========================================================
   클라우드 업무 데이터 불러오기
======================================================== */

async function loadCloudBoard() {

    setCloudSyncStatus(
        "waiting",
        "☁ 데이터 불러오는 중..."
    );


    const {
        data: { user },
        error: userError
    } = await sb.auth.getUser();


    if (userError || !user) {

        console.error(
            "사용자 확인 오류:",
            userError
        );

        document.getElementById(
            "cloudLoginBox"
        ).style.display = "flex";

        setCloudSyncStatus(
            "error",
            "☁ 로그인 필요"
        );

        return;
    }


    const { data, error } =
        await sb
            .from("board_state")
            .select("*")
            .eq("user_id", user.id)
            .maybeSingle();


    if (error) {

        console.error(
            "클라우드 불러오기 오류:",
            error
        );

        setCloudSyncStatus(
            "error",
            "☁ 불러오기 실패"
        );

        return;
    }


    /*
       Supabase에 이미 저장된 업무가 있으면
       그 내용을 PC/태블릿에 표시
    */
    if (data) {

        tasksData =
            Array.isArray(data.tasks)
                ? data.tasks
                : [];


        setStoredTasks(tasksData);


        if (data.title) {

            document.getElementById(
                "mainAppTitle"
            ).innerText = data.title;

            document.title =
                data.title;

            localStorage.setItem(
                "app_board_title",
                data.title
            );
        }


        renderBoard();

        cloudReady = true;

        setCloudSyncStatus(
            "synced",
            "☁ 동기화 완료"
        );

        return;
    }


    /*
       Supabase에 아직 데이터가 없는 최초 접속
       → 현재 PC의 업무내용을 최초 데이터로 저장
    */
    cloudReady = true;

    await saveCloudBoard();
}


/* ========================================================
   클라우드 업무 데이터 저장
======================================================== */

async function saveCloudBoard() {

    if (!cloudReady) {
        return;
    }


    setCloudSyncStatus(
        "syncing",
        "☁ 저장 중..."
    );


    const {
        data: { user },
        error: userError
    } = await sb.auth.getUser();


    if (userError || !user) {

        console.error(
            "사용자 확인 오류:",
            userError
        );

        setCloudSyncStatus(
            "error",
            "☁ 로그인 필요"
        );

        return;
    }


    const title =
        document.getElementById(
            "mainAppTitle"
        ).innerText.trim();


    const { error } =
        await sb
            .from("board_state")
            .upsert(
                {
                    user_id: user.id,
                    title: title,
                    tasks: tasksData,
                    updated_at:
                        new Date().toISOString()
                },
                {
                    onConflict: "user_id"
                }
            );


    if (error) {

        console.error(
            "클라우드 저장 오류:",
            error
        );

        setCloudSyncStatus(
            "error",
            "☁ 저장 실패"
        );

        return;
    }


    setCloudSyncStatus(
        "synced",
        "☁ 동기화 완료"
    );
}
    
    
    /* ========================================================
       1. 로컬 스토리지 하이브리드 엔진 (iPad WebKit 100% 호환)
    ======================================================== */
    const STORAGE_KEY = "SMART_BOARD_TASKS_DATA";

    function getStoredTasks() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        return raw ? JSON.parse(raw) : null;
      } catch (e) {
        return null;
      }
    }

    function setStoredTasks(tasks) {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(tasks));
      } catch (e) {
        alert('저장 용량이 초과되었거나 보안 설정으로 저장이 제한되었습니다.');
      }
    }

    let tasksData = getStoredTasks() || [
      {
        id: "task_sample_1",
        title: "2026년 하반기 통신 인프라 고도화 사업 일상감사 의뢰",
        startDate: "2026-09-01",
        dueDate: "2026-09-10",
        subtasks: [
          { text: "사업계획서 결재 완료", done: true },
          { text: "보안성 검토 결과 과업지시서 반영 확인", done: false },
          { text: "원가계산서 첨부하여 감사관실 의뢰", done: false }
        ],
        status: "doing1",
        files: []
      }
    ];

 function saveAll() {

    try {

        /* 현재 기기에도 즉시 저장 */
        setStoredTasks(tasksData);


        /* 화면 즉시 갱신 */
        requestAnimationFrame(() => {
            renderBoard();
        });


        /* 아직 클라우드 준비 전이면 여기까지만 */
        if (!cloudReady) {
            return;
        }


        setCloudSyncStatus(
            "syncing",
            "☁ 저장 중..."
        );


        clearTimeout(
            cloudSaveTimer
        );


        cloudSaveTimer =
            setTimeout(() => {

                saveCloudBoard();

            }, 500);


    } catch(e) {

        console.error(
            "저장 오류:",
            e
        );
    }
}

    /* ========================================================
       2. 백업/복원 (다운로드 + 텍스트 복사 2중 안전장치)
    ======================================================== */
    function handleExportClick() {
      const appTitle = localStorage.getItem('app_board_title') || "스마트 행정·정보화 업무 통합 관리 보드";
      const exportObj = {
        title: appTitle,
        exportDate: new Date().toISOString(),
        tasks: tasksData
      };

      const jsonStr = JSON.stringify(exportObj, null, 2);

      // iPad Safari 공유 저장 우선
      try {
        const blob = new Blob([jsonStr], { type: "application/json" });
        const file = new File([blob], "업무보드_백업.json", {
          type: "application/json"
        });

        if (navigator.share && navigator.canShare && navigator.canShare({files:[file]})) {
          navigator.share({
            title: "업무보드 백업",
            files: [file]
          });
          return;
        }
      } catch(e) {
        console.log(e);
      }

      // PC 및 기존 브라우저 다운로드
      try {
        const blob = new Blob([jsonStr], { type: "application/json" });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `업무보드_백업_${new Date().toISOString().slice(0,10)}.json`;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
      } catch(e) {
        openTextBackupModal(jsonStr);
      }
    }

    function handleImportClick() {
      // iPad 파일 선택기 호출
      const fileInput = document.getElementById('backupFileInput');
      if (fileInput) {
        fileInput.value = "";
        fileInput.click();
      }
    }

    function importDataBackup(input) {
      const file = input.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(e) {
        try {
          const parsed = JSON.parse(e.target.result);
          if (parsed && parsed.tasks) {
            tasksData = parsed.tasks;
            if (parsed.title) saveAppTitle(parsed.title);
            saveAll();
            alert('✅ 데이터 복원이 완료되었습니다.');
          } else {
            alert('올바른 백업 파일 형식이 아닙니다.');
          }
        } catch (err) {
          alert('복원 실패: ' + err.message);
        }
      };
      reader.readAsText(file);
    }

    // 모달 제어 (iPad 비상 텍스트 백업)
    function openTextBackupModal(jsonStr) {
      document.getElementById('modalTitle').innerText = "데이터 백업 (텍스트 복사)";
      document.getElementById('modalDesc').innerText = "아이패드에서 파일 저장이 차단된 경우, 아래 텍스트 전체를 복사하여 메모장에 보관하세요.";
      document.getElementById('modalTextarea').value = jsonStr;
      document.getElementById('modalConfirmBtn').style.display = "none";
      document.getElementById('backupModal').style.display = "flex";
    }

    function closeBackupModal() {
      document.getElementById('backupModal').style.display = "none";
    }

    function confirmModalAction() {
      try {
        const raw = document.getElementById('modalTextarea').value;
        const parsed = JSON.parse(raw);
        if (parsed.tasks) {
          tasksData = parsed.tasks;
          saveAll();
          alert('복원 완료!');
          closeBackupModal();
        }
      } catch(e) {
        alert('올바른 JSON 형식이 아닙니다.');
      }
    }

    /* ========================================================
       3. 메인 타이틀 & 탭 전환
    ======================================================== */
    function loadAppTitle() {
      const savedTitle = localStorage.getItem('app_board_title');
      if (savedTitle) {
        document.getElementById('mainAppTitle').innerText = savedTitle;
        document.title = savedTitle;
      }
    }

   function saveAppTitle(newTitle) {

    const title =
        newTitle.trim()
        ||
        "스마트 행정·정보화 업무 통합 관리 보드";


    document.getElementById(
        "mainAppTitle"
    ).innerText = title;


    document.title = title;


    localStorage.setItem(
        "app_board_title",
        title
    );


    if (!cloudReady) {
        return;
    }


    setCloudSyncStatus(
        "syncing",
        "☁ 저장 중..."
    );


    clearTimeout(
        cloudSaveTimer
    );


    cloudSaveTimer =
        setTimeout(() => {

            saveCloudBoard();

        }, 500);
}

    function handleTitleKeydown(e, el) {
      if (e.key === 'Enter') {
        e.preventDefault();
        el.blur();
      }
    }

    function switchTab(status, btn) {
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');

      document.querySelectorAll('.kanban-col').forEach(col => col.classList.remove('active-col'));
      const targetCol = document.getElementById(`col-${status}`);
      if (targetCol) targetCol.classList.add('active-col');
    }

    /* ========================================================
       4. D-Day 계산
    ======================================================== */
    function getDDay(dateStr) {
      if (!dateStr) return { text: "기한 미지정", className: "d-day-normal" };
      const today = new Date();
      today.setHours(0, 0, 0, 0);
      const target = new Date(dateStr);
      target.setHours(0, 0, 0, 0);

      const diffTime = target - today;
      const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));

      if (diffDays < 0) return { text: `D+${Math.abs(diffDays)} (지연)`, className: "d-day-urgent" };
      if (diffDays === 0) return { text: "D-Day (오늘)", className: "d-day-urgent" };
      if (diffDays <= 3) return { text: `D-${diffDays} (임박)`, className: "d-day-warn" };
      return { text: `D-${diffDays}`, className: "d-day-normal" };
    }

    /* ========================================================
       5. 렌더링 엔진
    ======================================================== */
    function renderBoard() {
      const lists = {
        todo: document.getElementById('list-todo'),
        doing1: document.getElementById('list-doing1'),
        doing2: document.getElementById('list-doing2'),
        done: document.getElementById('list-done')
      };

      lists.todo.innerHTML = "";
      lists.doing1.innerHTML = "";
      lists.doing2.innerHTML = "";
      lists.done.innerHTML = "";

      const counts = { todo: 0, doing1: 0, doing2: 0, done: 0 };

      tasksData.forEach(task => {
        if (task.status === 'doing') task.status = 'doing1';
        if (!lists[task.status]) task.status = 'todo';
        counts[task.status]++;

        const isDone = task.status === 'done';
        const dDay = getDDay(task.dueDate);

        const card = document.createElement('div');
        card.className = `task-card ${isDone ? 'done-compact' : ''}`;
        card.draggable = true;
        card.id = task.id;

        card.ondragstart = (e) => handleDragStart(e, task.id);
        card.ondragend = handleDragEnd;
        card.ondragover = (e) => { e.preventDefault(); card.classList.add('dragover-card'); };
        card.ondragleave = () => card.classList.remove('dragover-card');
        card.ondrop = (e) => handleCardFileDrop(e, task.id);

        if (isDone) {
          card.innerHTML = `
            <div class="card-top">
              <span class="d-day-badge done-badge">✓ 완료됨</span>
              <span class="done-date">${task.dueDate || ''}</span>
            </div>
            <div class="card-title" contenteditable="true" 
                 onblur="updateTaskTitle('${task.id}', this.innerText)" 
                 onkeydown="handleTitleKeydown(event, this)">${task.title}</div>
            <div class="card-footer">
              <select class="move-select" onchange="changeTaskStatus('${task.id}', this.value)">
                <option value="todo" ${task.status === 'todo' ? 'selected' : ''}>🔵 해야할 업무</option>
                <option value="doing1" ${task.status === 'doing1' ? 'selected' : ''}>🟠 진행 Ⅰ</option>
                <option value="doing2" ${task.status === 'doing2' ? 'selected' : ''}>🔶 진행 Ⅱ</option>
                <option value="done" ${task.status === 'done' ? 'selected' : ''}>🟢 완료</option>
              </select>
              <button class="btn-del-card" onclick="removeTask('${task.id}')">삭제</button>
            </div>
          `;
        } else {
          const subtasks = task.subtasks || [];
          const files = task.files || [];

          let subtasksHtml = `
            <div class="subtasks-container">
              ${subtasks.map((st, idx) => `
                <div class="subtask-row ${st.done ? 'completed' : ''}">
                  <input type="checkbox" ${st.done ? 'checked' : ''} onchange="toggleSubtask('${task.id}', ${idx})">
                  <div class="subtask-text" contenteditable="true" 
                       onblur="updateSubtaskText('${task.id}', ${idx}, this.innerText)"
                       onkeydown="handleTitleKeydown(event, this)">${st.text}</div>
                  <button class="btn-subtask-del" onclick="deleteSubtask('${task.id}', ${idx})">✕</button>
                </div>
              `).join('')}
              <button class="btn-add-subtask" onclick="addSubtaskItem('${task.id}')">➕ 세부 업무 추가</button>
            </div>
          `;

          let filesHtml = `
            <div class="attachments-section">
              <div class="att-top">
                <span class="att-header">📎 붙임파일 (${files.length})</span>
                <button class="btn-add-file" onclick="triggerFileUpload('${task.id}')">➕ 파일 첨부</button>
              </div>
              <div class="att-list">
                ${files.map((file, idx) => `
                  <div class="att-pill">
                    <span class="att-name" onclick="downloadFile('${task.id}', ${idx})">${file.name}</span>
                    <button class="att-del" onclick="deleteAttachment('${task.id}', ${idx})">✕</button>
                  </div>
                `).join('')}
              </div>
            </div>
          `;

          card.innerHTML = `
            <div class="card-top">
              <span class="d-day-badge ${dDay.className}">⏳ ${dDay.text}</span>
              <div class="date-picker-group">
                <input type="date" class="inline-date-input" value="${task.startDate || ''}" onchange="updateTaskDate('${task.id}', 'startDate', this.value)">
                ~
                <input type="date" class="inline-date-input" value="${task.dueDate || ''}" onchange="updateTaskDate('${task.id}', 'dueDate', this.value)">
              </div>
            </div>
            <div class="card-title" contenteditable="true" 
                 onblur="updateTaskTitle('${task.id}', this.innerText)" 
                 onkeydown="handleTitleKeydown(event, this)">${task.title}</div>
            ${subtasksHtml}
            ${filesHtml}
            <div class="card-footer">
              <select class="move-select" onchange="changeTaskStatus('${task.id}', this.value)">
                <option value="todo" ${task.status === 'todo' ? 'selected' : ''}>🔵 해야할 업무</option>
                <option value="doing1" ${task.status === 'doing1' ? 'selected' : ''}>🟠 진행 Ⅰ</option>
                <option value="doing2" ${task.status === 'doing2' ? 'selected' : ''}>🔶 진행 Ⅱ</option>
                <option value="done" ${task.status === 'done' ? 'selected' : ''}>🟢 완료</option>
              </select>
              <button class="btn-del-card" onclick="removeTask('${task.id}')">삭제</button>
            </div>
          `;
        }

        lists[task.status].appendChild(card);
      });

      document.getElementById('count-todo').innerText = counts.todo;
      document.getElementById('count-doing1').innerText = counts.doing1;
      document.getElementById('count-doing2').innerText = counts.doing2;
      document.getElementById('count-done').innerText = counts.done;

      document.getElementById('tab-count-todo').innerText = counts.todo;
      document.getElementById('tab-count-doing1').innerText = counts.doing1;
      document.getElementById('tab-count-doing2').innerText = counts.doing2;
      document.getElementById('tab-count-done').innerText = counts.done;
    }

    /* ========================================================
       6. 실시간 데이터 조작 핸들러
    ======================================================== */
    function addNewBlankTask() {
      const todayStr = new Date().toISOString().split('T')[0];
      const newTask = {
        id: "task_" + Date.now(),
        title: "새 업무명 (터치하여 수정)",
        startDate: todayStr,
        dueDate: todayStr,
        subtasks: [{ text: "세부 업무 내용 입력 (터치)", done: false }],
        status: "todo",
        files: []
      };
      tasksData.unshift(newTask);
      saveAll();
    }

    function updateTaskTitle(taskId, newTitle) {
      const task = tasksData.find(t => t.id === taskId);
      if (task && newTitle.trim()) {
        task.title = newTitle.trim();
        saveAll();
      }
    }

    function updateTaskDate(taskId, field, newDate) {
      const task = tasksData.find(t => t.id === taskId);
      if (task) {
        task[field] = newDate;
        saveAll();
      }
    }

    function updateSubtaskText(taskId, subtaskIdx, newText) {
      const task = tasksData.find(t => t.id === taskId);
      if (task && task.subtasks && task.subtasks[subtaskIdx]) {
        task.subtasks[subtaskIdx].text = newText.trim();
        saveAll();
      }
    }

    function toggleSubtask(taskId, subtaskIdx) {
      const task = tasksData.find(t => t.id === taskId);
      if (task && task.subtasks && task.subtasks[subtaskIdx]) {
        task.subtasks[subtaskIdx].done = !task.subtasks[subtaskIdx].done;
        saveAll();
      }
    }

    function addSubtaskItem(taskId) {
      const task = tasksData.find(t => t.id === taskId);
      if (task) {
        if (!task.subtasks) task.subtasks = [];
        task.subtasks.push({ text: "새 세부 업무 입력", done: false });
        saveAll();
      }
    }

    function deleteSubtask(taskId, subtaskIdx) {
      const task = tasksData.find(t => t.id === taskId);
      if (task && task.subtasks) {
        task.subtasks.splice(subtaskIdx, 1);
        saveAll();
      }
    }

    function changeTaskStatus(id, newStatus) {
      const task = tasksData.find(t => t.id === id);
      if (task) {
        task.status = newStatus;
        saveAll();
      }
    }

    function removeTask(id) {
      if (confirm('이 업무 항목을 삭제하시겠습니까?')) {
        tasksData = tasksData.filter(t => t.id !== id);
        saveAll();
      }
    }

/* ========================================================
   7. 파일 첨부/다운로드/삭제
   - Supabase Storage attachments 버킷 사용
======================================================== */

let currentTargetTaskId = null;


/* 파일 첨부 버튼 클릭 */
function triggerFileUpload(taskId) {

    currentTargetTaskId = taskId;

    const input =
        document.getElementById("directFileInput");

    input.value = "";
    input.click();
}


/* 파일 선택 완료 */
async function handleDirectFileSelected(input) {

    if (
        !currentTargetTaskId ||
        input.files.length === 0
    ) {
        return;
    }


    const targetTaskId =
        currentTargetTaskId;


    /*
       iPad Safari에서는 파일 선택창을 비우기 전에
       선택된 파일을 먼저 별도 배열로 복사
    */
    const selectedFiles =
        Array.from(input.files);


    currentTargetTaskId = null;

    input.value = "";


    await attachFiles(
        targetTaskId,
        selectedFiles
    );
}


/* PC에서 카드로 파일 드래그 */
function handleCardFileDrop(e, taskId) {

    e.preventDefault();

    e.currentTarget.classList.remove(
        "dragover-card"
    );

    if (
        e.dataTransfer.files.length > 0
    ) {

        attachFiles(
            taskId,
            e.dataTransfer.files
        );
    }
}


/* 저장 경로에 사용할 파일 확장자 */
function getStorageFileExtension(fileName) {

    const dotIndex =
        fileName.lastIndexOf(".");

    if (
        dotIndex <= 0 ||
        dotIndex === fileName.length - 1
    ) {
        return "";
    }

    const extension =
        fileName
            .slice(dotIndex + 1)
            .replace(
                /[^a-zA-Z0-9]/g,
                ""
            )
            .slice(0, 10);

    if (!extension) {
        return "";
    }

    return "." + extension;
}


/* 중복되지 않는 파일 ID 생성 */
function createStorageFileId() {

    if (
        window.crypto &&
        typeof window.crypto.randomUUID === "function"
    ) {

        return window.crypto.randomUUID();
    }

    return (
        Date.now().toString() +
        "_" +
        Math.random()
            .toString(36)
            .slice(2)
    );
}


/* ========================================================
   Supabase Storage에 파일 업로드
======================================================== */

async function attachFiles(
    taskId,
    fileList
) {

    const task =
        tasksData.find(
            t => t.id === taskId
        );

    if (!task) {
        return;
    }

    if (!task.files) {
        task.files = [];
    }


    const {
        data: { user },
        error: userError
    } = await sb.auth.getUser();


    if (
        userError ||
        !user
    ) {

        console.error(
            "첨부파일 사용자 확인 오류:",
            userError
        );

        alert(
            "로그인 정보를 확인할 수 없습니다."
        );

        setCloudSyncStatus(
            "error",
            "☁ 파일 업로드 실패"
        );

        return;
    }


    const files =
        Array.from(fileList);


    setCloudSyncStatus(
        "syncing",
        "☁ 파일 업로드 중..."
    );


    let successCount = 0;


    for (const file of files) {

        const fileId =
            createStorageFileId();

        const extension =
            getStorageFileExtension(
                file.name
            );


        /*
           Storage 저장 구조

           사용자ID/
               업무ID/
                   고유파일ID.확장자

           첫 번째 폴더가 사용자ID이므로
           현재 설정한 Storage RLS 정책과 맞습니다.
        */
        const storagePath =
            user.id +
            "/" +
            taskId +
            "/" +
            fileId +
            extension;


        const {
            error: uploadError
        } =
            await sb.storage
                .from("attachments")
                .upload(
                    storagePath,
                    file,
                    {
                        cacheControl: "3600",
                        upsert: false,
                        contentType:
                            file.type ||
                            "application/octet-stream"
                    }
                );


        if (uploadError) {

            console.error(
                "파일 업로드 오류:",
                uploadError
            );

            alert(
                "파일 업로드 실패:\n" +
                file.name
            );

            continue;
        }


        /*
           업무 데이터에는 실제 파일을 넣지 않고
           파일 정보와 Storage 경로만 저장
        */
        task.files.push({
            name: file.name,
            type: file.type,
            size: file.size,
            path: storagePath
        });


        successCount++;
    }


    if (successCount > 0) {

        /*
           파일 경로를 board_state에도 저장
        */
        saveAll();

    } else {

        setCloudSyncStatus(
            "error",
            "☁ 파일 업로드 실패"
        );
    }
}


/* ========================================================
   첨부파일 열기
======================================================== */

async function downloadFile(
    taskId,
    fileIdx
) {

    const task =
        tasksData.find(
            t => t.id === taskId
        );


    if (
        !task ||
        !task.files ||
        !task.files[fileIdx]
    ) {
        return;
    }


    const file =
        task.files[fileIdx];


    /*
       앞으로 모든 첨부파일은
       Supabase Storage path 방식만 사용
    */
    if (!file.path) {

        alert(
            "이 첨부파일은 예전 테스트 방식으로 저장된 파일입니다.\n삭제 후 다시 첨부해 주세요."
        );

        return;
    }


    setCloudSyncStatus(
        "syncing",
        "☁ 파일 여는 중..."
    );


    const {
        data,
        error
    } =
        await sb.storage
            .from("attachments")
            .createSignedUrl(
                file.path,
                300
            );


    if (
        error ||
        !data ||
        !data.signedUrl
    ) {

        console.error(
            "파일 열기 오류:",
            error
        );


        alert(
            "첨부파일을 열 수 없습니다."
        );


        setCloudSyncStatus(
            "error",
            "☁ 파일 열기 실패"
        );

        return;
    }


    /*
       PC와 iPad 모두 동일한 방식
       별도 저장 없이 브라우저에서 바로 열기
    */
    window.location.href =
        data.signedUrl;


    setCloudSyncStatus(
        "synced",
        "☁ 동기화 완료"
    );
}


/* ========================================================
   첨부파일 삭제
======================================================== */

async function deleteAttachment(
    taskId,
    fileIdx
) {

    const task =
        tasksData.find(
            t => t.id === taskId
        );


    if (
        !task ||
        !task.files ||
        !task.files[fileIdx]
    ) {
        return;
    }


    const file =
        task.files[fileIdx];


    /*
       새 Storage 방식 파일이면
       Storage에서도 실제 파일 삭제
    */
    if (file.path) {

        setCloudSyncStatus(
            "syncing",
            "☁ 파일 삭제 중..."
        );


        const {
            error
        } =
            await sb.storage
                .from("attachments")
                .remove([
                    file.path
                ]);


        if (error) {

            console.error(
                "첨부파일 삭제 오류:",
                error
            );

            alert(
                "첨부파일 삭제에 실패했습니다."
            );

            setCloudSyncStatus(
                "error",
                "☁ 파일 삭제 실패"
            );

            return;
        }
    }


    /*
       업무 카드의 첨부파일 목록에서도 제거
    */
    task.files.splice(
        fileIdx,
        1
    );


    saveAll();
}

    /* ========================================================
       8. 드래그 앤 드롭
    ======================================================== */
    let draggedId = null;
    function handleDragStart(e, id) {
      if (e.target.getAttribute('contenteditable') === 'true') {
        e.preventDefault();
        return;
      }
      draggedId = id;
      e.target.classList.add('dragging');
    }
    function handleDragEnd(e) {
      e.target.classList.remove('dragging');
    }
    function allowDrop(e) { e.preventDefault(); }
    function handleDrop(e, targetStatus) {
      e.preventDefault();
      if (draggedId) {
        changeTaskStatus(draggedId, targetStatus);
        draggedId = null;
      }
    }

    // 초기 실행
    loadAppTitle();
    renderBoard();
    initCloud();
  </script>

document.addEventListener('DOMContentLoaded', function(){
  const newBtn = document.querySelector('.btn-new-task');
  if(newBtn){
    newBtn.addEventListener('touchend', function(e){
      e.preventDefault();
      addNewBlankTask();
    }, {passive:false});
  }
});
</script>

<script>
(async function clearSmartBoardServiceWorker() {

    if ("serviceWorker" in navigator) {

        const registrations =
            await navigator.serviceWorker.getRegistrations();

        for (const registration of registrations) {

            if (
                registration.scope.includes(
                    "/smart-work-board/"
                )
            ) {

                await registration.unregister();
            }
        }
    }


    if ("caches" in window) {

        const cacheNames =
            await caches.keys();

        await Promise.all(

            cacheNames
                .filter(name =>
                    name.startsWith("smart-board")
                )
                .map(name =>
                    caches.delete(name)
                )

        );
    }


    console.log(
        "Smart Work Board Service Worker / Cache cleared"
    );

})();
</script>

<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>공문서 자동 작성</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@500;700&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#F3F4F1; --paper-dark:#E8E9E4;
    --ink:#1C2430; --ink-soft:#5B6472;
    --navy:#16305C; --navy-soft:#2C4573;
    --seal:#8E2B26;
    --line:#C9CCC3;
    --card:#FCFCFA;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --paper:#14171C; --paper-dark:#1B1F26;
      --ink:#E7E9ED; --ink-soft:#9AA2B0;
      --navy:#7C9AD1; --navy-soft:#5A78AC;
      --seal:#D97C74;
      --line:#333A45;
      --card:#1C2029;
    }
  }
  :root[data-theme="dark"]{
    --paper:#14171C; --paper-dark:#1B1F26;
    --ink:#E7E9ED; --ink-soft:#9AA2B0;
    --navy:#7C9AD1; --navy-soft:#5A78AC;
    --seal:#D97C74;
    --line:#333A45;
    --card:#1C2029;
  }
  *{box-sizing:border-box;}
  html{scroll-padding-top:env(safe-area-inset-top,0px);}
  body{
    margin:0; background:var(--paper); color:var(--ink);
    font-family:'Noto Sans KR',sans-serif;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
    min-height:100%;
  }
  header{
    padding:28px 24px 20px; border-bottom:2px solid var(--navy);
    position:sticky; top:0; background:var(--paper); z-index:5;
    padding-top:calc(28px + env(safe-area-inset-top,0px));
  }
  header .eyebrow{font-size:13px; color:var(--seal); font-weight:700; letter-spacing:.02em;}
  header h1{
    font-family:'Noto Serif KR',serif; font-weight:700; font-size:clamp(22px,4vw,30px);
    margin:4px 0 6px; color:var(--navy);
  }
  header p{margin:0; color:var(--ink-soft); font-size:14px; line-height:1.5;}

  .layout{display:grid; grid-template-columns:280px 1fr; gap:0; max-width:1180px; margin:0 auto;}
  @media (max-width:820px){ .layout{grid-template-columns:1fr;} }

  .sidebar{border-right:1px solid var(--line); padding:20px 18px; min-height:0;}
  @media (max-width:820px){ .sidebar{border-right:none; border-bottom:1px solid var(--line);} }
  .sidebar h2{font-size:14px; color:var(--ink-soft); font-weight:500; margin:0 0 12px;}

  .tpl-list{display:flex; flex-direction:column; gap:8px; margin-bottom:18px;}
  .tpl-item{
    text-align:left; border:1px solid var(--line); background:var(--card);
    border-radius:4px; padding:12px 14px; cursor:pointer; color:var(--ink);
    font-family:inherit; font-size:14px;
  }
  .tpl-item .name{font-weight:700;}
  .tpl-item .desc{display:block; margin-top:3px; font-size:12px; color:var(--ink-soft); line-height:1.4;}
  .tpl-item.active{border-color:var(--navy); border-width:2px; padding:11px 13px;}
  .tpl-item.active .name{color:var(--navy);}
  .tpl-item.custom .name::after{content:" · 사용자 서식"; font-size:11px; font-weight:400; color:var(--ink-soft);}

  .add-tpl{border:1px dashed var(--line); border-radius:4px; padding:12px; background:transparent;}
  .add-tpl summary{cursor:pointer; font-size:13px; color:var(--navy-soft); font-weight:500; list-style:none;}
  .add-tpl summary::-webkit-details-marker{display:none;}
  .add-tpl summary::before{content:"+ "; font-weight:700;}
  .add-tpl[open] summary::before{content:"– ";}
  .add-tpl textarea, .add-tpl input{
    width:100%; margin-top:8px; border:1px solid var(--line); border-radius:4px;
    background:var(--card); color:var(--ink); font-family:inherit; font-size:13px; padding:8px;
  }
  .add-tpl textarea{min-height:100px; resize:vertical;}
  .add-tpl button{
    margin-top:8px; border:1px solid var(--navy); background:var(--navy); color:#fff;
    padding:7px 12px; border-radius:4px; font-size:13px; cursor:pointer;
  }
  .tpl-remove{margin-top:10px; font-size:12px; color:var(--seal); background:none; border:none; cursor:pointer; padding:0;}

  main{padding:24px; min-width:0;}
  .field label{display:block; font-size:13px; color:var(--ink-soft); margin-bottom:6px;}
  .field textarea{
    width:100%; min-height:150px; border:1px solid var(--line); border-radius:6px;
    background:var(--card); color:var(--ink); font-family:inherit; font-size:14px;
    padding:12px; line-height:1.6; resize:vertical;
  }
  .field textarea:focus, .tpl-item:focus-visible, .add-tpl textarea:focus, .add-tpl input:focus{
    outline:2px solid var(--navy); outline-offset:1px;
  }
  .actions{display:flex; align-items:center; gap:12px; margin:14px 0 24px;}
  .generate-btn{
    background:var(--seal); color:#fff; border:none; border-radius:4px;
    padding:11px 22px; font-size:14px; font-weight:700; cursor:pointer; font-family:inherit;
  }
  .generate-btn:disabled{opacity:.5; cursor:default;}
  .status{font-size:13px; color:var(--ink-soft);}

  .result{border:1px solid var(--line); border-radius:6px; background:var(--card); overflow:hidden;}
  .result-head{
    display:flex; justify-content:space-between; align-items:center;
    padding:10px 16px; border-bottom:1px solid var(--line); background:var(--paper-dark);
  }
  .result-head span{font-size:13px; color:var(--ink-soft);}
  .copy-btn{
    background:none; border:1px solid var(--navy-soft); color:var(--navy-soft);
    border-radius:4px; padding:5px 10px; font-size:12px; cursor:pointer; font-family:inherit;
  }
  #output{
    width:100%; min-height:360px; border:none; background:transparent; color:var(--ink);
    font-family:'Noto Serif KR',serif; font-size:14.5px; line-height:1.85; padding:20px 22px;
    resize:vertical; white-space:pre-wrap;
  }
  .empty{padding:40px 22px; color:var(--ink-soft); font-size:14px; text-align:center;}
</style>
</head>
<body>

<header>
  <div class="eyebrow">119종합상황실 · 정보통신팀</div>
  <h1>공문서 자동 작성</h1>
  <p>서식을 고르고 대략적인 내용을 적으면, 공문서 문체에 맞춰 초안을 작성합니다. 서식은 직접 추가해 계속 쌓아둘 수 있습니다.</p>
</header>

<div class="layout">
  <div class="sidebar">
    <h2>서식 선택</h2>
    <div class="tpl-list" id="tplList"></div>
    <details class="add-tpl">
      <summary>새 서식 추가</summary>
      <input type="text" id="newTplName" placeholder="서식 이름 (예: 대외협력 공문)">
      <textarea id="newTplBody" placeholder="서식 구조를 붙여넣거나 항목을 적어주세요.&#10;예) 제목 / 1. 추진배경 / 2. 추진계획 / 3. 행정사항 / 붙임"></textarea>
      <button id="addTplBtn" type="button">서식 저장</button>
    </details>
  </div>

  <main>
    <div class="field">
      <label for="rough">대략적인 내용</label>
      <textarea id="rough" placeholder="핵심 내용, 배경, 숫자, 일정 등을 자유롭게 메모하듯 적어주세요."></textarea>
    </div>
    <div class="actions">
      <button class="generate-btn" id="genBtn" type="button">초안 생성</button>
      <span class="status" id="status"></span>
    </div>

    <div class="result">
      <div class="result-head">
        <span id="resultLabel">생성 결과</span>
        <button class="copy-btn" id="copyBtn" type="button" style="display:none;">복사</button>
      </div>
      <div id="resultBody">
        <div class="empty">서식을 선택하고 내용을 입력한 뒤 초안을 생성해보세요.</div>
      </div>
    </div>
  </main>
</div>

<script>
const PRESETS = [
  {id:'p1', name:'기안문(내부결재)', builtin:true,
   body:'제목 / 1. 관련 근거 / 2. 목적(추진배경) / 3. 주요 내용(세부 추진계획) / 4. 행정사항(예산, 일정, 협조 등) / 붙임'},
  {id:'p2', name:'시행문(발신 공문)', builtin:true,
   body:'수신 / 경유 / 제목 / 본문(요청·통보·협조 사항을 정중한 공문 어투로) / 붙임 / 발신명의'},
  {id:'p3', name:'보고서(요약형)', builtin:true,
   body:'제목 / 1. 개요(목적·배경) / 2. 현황 및 문제점 / 3. 추진계획(세부 과제, 일정) / 4. 기대효과 / 5. 행정사항'},
  {id:'p4', name:'계획보고', builtin:true,
   body:'제목 / 1. 추진배경 / 2. 추진근거 / 3. 세부 추진계획(대상, 방법, 일정, 예산) / 4. 향후계획 / 붙임'},
  {id:'p5', name:'협조요청 공문', builtin:true,
   body:'수신 / 제목 / 1. 요청 배경 / 2. 협조 요청 사항(구체적으로) / 3. 회신 기한 및 방법 / 붙임'},
  {id:'p6', name:'대구소방 기본보고서(20장형)', builtin:true,
   body:'상단 체크박스(재난상황보고/정책보고/언론대응/회의행사/동향보고/기타 중 표기) / 제목(부제 - 핵심제목 형식) / □ 관련근거 및 추진배경 (○, -, ※ 계층으로 서술) / □ 추진계획 (①②③ 번호 항목별로 (세부구분) 형식의 소제목을 붙여 -로 세부 서술) / □ 기대효과 (○ 항목 나열)'},
  {id:'p7', name:'대구소방 표지·결재라인', builtin:true,
   body:'[표지] 제목 상자(○○○○ 추진계획 형식) / 보고일자(YYYY. M.) / 기관명(대구소방안전본부) / 부서명 / [결재라인] 등록번호·등록일자·결재일자·공개구분 / 담당자-팀장-과장-본부장 결재란 / 협조자 명단'},
  {id:'p8', name:'간이 보고서(핵심요약형)', builtin:true,
   body:'제목 / 보고일자(’YY. M. D.(요일)) 및 보고자·연락처(우측 정렬) / 핵심요약 박스(보고서 내용을 3줄 이내로 요약) / □ (본문 1단락, 필요시 ○ - 계층으로 세부 서술)'}
];

const state = { templates: [], selectedId: null };

function loadTemplates(){
  let custom = [];
  try{ custom = JSON.parse(localStorage.getItem('docTemplates')||'[]'); }catch(e){ custom = []; }
  state.templates = [...PRESETS, ...custom];
  state.selectedId = state.templates[0]?.id || null;
}
function saveCustom(){
  const custom = state.templates.filter(t=>!t.builtin);
  try{ localStorage.setItem('docTemplates', JSON.stringify(custom)); }catch(e){}
}

function renderTemplates(){
  const list = document.getElementById('tplList');
  list.innerHTML = '';
  state.templates.forEach(t=>{
    const item = document.createElement('button');
    item.type = 'button';
    item.className = 'tpl-item' + (t.id===state.selectedId ? ' active':'') + (t.builtin?'':' custom');
    item.innerHTML = `<span class="name">${escapeHtml(t.name)}</span><span class="desc">${escapeHtml(t.body.slice(0,44))}${t.body.length>44?'…':''}</span>`;
    item.addEventListener('click', ()=>{ state.selectedId = t.id; renderTemplates(); });
    if(!t.builtin){
      const rm = document.createElement('button');
      rm.type='button'; rm.className='tpl-remove'; rm.textContent='삭제';
      rm.addEventListener('click', (e)=>{
        e.stopPropagation();
        state.templates = state.templates.filter(x=>x.id!==t.id);
        if(state.selectedId===t.id) state.selectedId = state.templates[0]?.id || null;
        saveCustom(); renderTemplates();
      });
      item.appendChild(rm);
    }
    list.appendChild(item);
  });
}

function escapeHtml(s){
  return s.replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

document.getElementById('addTplBtn').addEventListener('click', ()=>{
  const name = document.getElementById('newTplName').value.trim();
  const body = document.getElementById('newTplBody').value.trim();
  if(!name || !body) return;
  const t = { id:'c'+Date.now(), name, body, builtin:false };
  state.templates.push(t);
  state.selectedId = t.id;
  saveCustom(); renderTemplates();
  document.getElementById('newTplName').value='';
  document.getElementById('newTplBody').value='';
});

let sampleFn = null;
async function initSample(){
  try{
    const s = await window.claude.use('sample');
    sampleFn = s;
  }catch(e){ sampleFn = null; }
}

document.getElementById('genBtn').addEventListener('click', async ()=>{
  const status = document.getElementById('status');
  const resultBody = document.getElementById('resultBody');
  const copyBtn = document.getElementById('copyBtn');
  const rough = document.getElementById('rough').value.trim();
  const tpl = state.templates.find(t=>t.id===state.selectedId);

  if(!tpl){ status.textContent='서식을 먼저 선택해주세요.'; return; }
  if(!rough){ status.textContent='대략적인 내용을 입력해주세요.'; return; }
  if(!sampleFn){ await initSample(); }
  if(!sampleFn){
    status.textContent='이 화면에서는 자동 생성 기능을 사용할 수 없습니다.';
    return;
  }

  const btn = document.getElementById('genBtn');
  btn.disabled = true;
  status.textContent = '작성 중...';
  resultBody.innerHTML = '<div class="empty">초안을 작성하고 있습니다…</div>';

  const prompt = `너는 대한민국 소방·행정기관에서 근무하는 실무자를 돕는 공문서 초안 작성 도우미다.
아래 [서식 구조]를 그대로 따르되, 각 항목 제목은 서식에 준하는 표준 공문서 항목명으로 다듬어 사용하라.
[대략적인 내용]에 있는 정보를 바탕으로 문맥에 맞는 정확한 단어를 선택하고, 상투적이지 않으면서도 격식 있는 공무원 공문서 문체로 완성된 문장을 작성하라.
오탈자와 비문이 없어야 하며, 추측이나 불확실한 수치는 만들어내지 말고 [대략적인 내용]에 없는 내용은 "(내용 확인 필요)"로 표시하라.
결과는 실제 공문서처럼 바로 사용할 수 있는 완성된 텍스트로만 출력하고, 설명이나 안내 문구는 붙이지 마라.

[서식 구조]
${tpl.body}

[대략적인 내용]
${rough}`;

  resultBody.innerHTML = '';
  const out = document.createElement('textarea');
  out.id = 'output';
  resultBody.appendChild(out);

  try{
    await sampleFn(prompt, {
      modelTier: 'default',
      onText: ({text}) => { out.value = text; }
    });
    status.textContent = '작성 완료';
    copyBtn.style.display = 'inline-block';
  }catch(e){
    status.textContent = '생성 중 오류가 발생했습니다. 다시 시도해주세요.';
  }finally{
    btn.disabled = false;
  }
});

document.getElementById('copyBtn').addEventListener('click', async ()=>{
  const out = document.getElementById('output');
  if(!out) return;
  try{
    await navigator.clipboard.writeText(out.value);
    document.getElementById('status').textContent = '클립보드에 복사되었습니다.';
  }catch(e){
    document.getElementById('status').textContent = '복사에 실패했습니다. 직접 선택해 복사해주세요.';
  }
});

loadTemplates();
renderTemplates();
initSample();
</script>
</body>
</html>
